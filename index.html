<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>World Forecast</title>
<style>
:root{--bg:#f5f7fa;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:1180px;margin:auto;padding:42px 24px 60px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:28px}
h1{font-size:38px;letter-spacing:-1.5px;margin:0 0 6px}.sub{color:var(--muted);margin:0}
.search{width:280px;padding:12px 15px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:14px;outline:none}
.search:focus{border-color:#93c5fd;box-shadow:0 0 0 3px #dbeafe}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.filter{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;cursor:pointer;color:#4b5563}.filter.active{background:#111827;color:#fff;border-color:#111827}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 5px 18px rgba(15,23,42,.04)}
.top{display:flex;justify-content:space-between;align-items:flex-start}.city{font-weight:700;font-size:18px}.country{color:var(--muted);font-size:13px;margin-top:3px}.temp{font-size:42px;font-weight:700;letter-spacing:-2px;margin:22px 0 4px}.condition{color:#374151}.meta{display:flex;gap:18px;color:var(--muted);font-size:12px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.icon{font-size:34px}.empty{text-align:center;padding:70px;color:var(--muted);grid-column:1/-1}
.detail{margin-top:28px;background:#111827;color:#fff;border-radius:22px;padding:25px;display:none}
.detail.show{display:block}.detail-head{display:flex;justify-content:space-between;align-items:center}.detail h2{margin:0;font-size:24px}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:20px}
.day{background:#1f2937;border-radius:12px;padding:12px;text-align:center}.day small{color:#9ca3af}.day strong{display:block;margin:8px 0}.loading{opacity:.55}
footer{margin-top:24px;color:#9ca3af;font-size:12px;text-align:center}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}header{align-items:flex-start;flex-direction:column}.search{width:100%}}
@media(max-width:560px){.grid{grid-template-columns:1fr}.wrap{padding:28px 16px}.days{grid-template-columns:repeat(4,1fr)}h1{font-size:32px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><h1>World Forecast</h1><p class="sub">A simple weather view for capital cities around the world.</p></div>
  <input id="search" class="search" placeholder="Search a capital or country…" aria-label="Search">
</header>
<div class="toolbar" id="filters"></div>
<section id="grid" class="grid"></section>
<section id="detail" class="detail"></section>
<footer>Weather data from Open-Meteo · Temperatures in °C</footer>
</div>

<script>
const cities=[
["Seoul","South Korea",37.5665,126.978],["Tokyo","Japan",35.6762,139.6503],
["Beijing","China",39.9042,116.4074],["Singapore","Singapore",1.3521,103.8198],
["Bangkok","Thailand",13.7563,100.5018],["New Delhi","India",28.6139,77.209],
["Canberra","Australia",-35.2809,149.13],["Wellington","New Zealand",-41.2866,174.7756],
["London","United Kingdom",51.5074,-0.1278],["Paris","France",48.8566,2.3522],
["Berlin","Germany",52.52,13.405],["Rome","Italy",41.9028,12.4964],
["Madrid","Spain",40.4168,-3.7038],["Cairo","Egypt",30.0444,31.2357],
["Nairobi","Kenya",-1.2921,36.8219],["Abuja","Nigeria",9.0765,7.3986],
["Brasília","Brazil",-15.7939,-47.8828],["Buenos Aires","Argentina",-34.6037,-58.3816],
["Washington, D.C.","United States",38.9072,-77.0369],["Ottawa","Canada",45.4215,-75.6972],
["Mexico City","Mexico",19.4326,-99.1332],["Lima","Peru",-12.0464,-77.0428],
["Santiago","Chile",-33.4489,-70.6693],["Ankara","Türkiye",39.9334,32.8597]
];
const regions={Asia:["Seoul","Tokyo","Beijing","Singapore","Bangkok","New Delhi"],Europe:["London","Paris","Berlin","Rome","Madrid","Ankara"],Americas:["Washington, D.C.","Ottawa","Mexico City","Lima","Santiago","Buenos Aires","Brasília"],Africa:["Cairo","Nairobi","Abuja"],Oceania:["Canberra","Wellington"]};
const icons={0:"☀️",1:"🌤️",2:"⛅",3:"☁️",45:"🌫️",48:"🌫️",51:"🌦️",53:"🌦️",55:"🌧️",61:"🌧️",63:"🌧️",65:"🌧️",71:"🌨️",73:"🌨️",75:"❄️",80:"🌦️",81:"🌦️",82:"🌧️",95:"⛈️",96:"⛈️",99:"⛈️"};
const labels={0:"Clear",1:"Mainly clear",2:"Partly cloudy",3:"Overcast",45:"Fog",48:"Fog",51:"Light drizzle",53:"Drizzle",55:"Heavy drizzle",61:"Light rain",63:"Rain",65:"Heavy rain",71:"Light snow",73:"Snow",75:"Heavy snow",80:"Rain showers",81:"Rain showers",82:"Heavy showers",95:"Thunderstorm",96:"Thunderstorm",99:"Thunderstorm"};
let active="All", data=[];

function makeFilters(){
  const el=document.getElementById("filters");
  ["All",...Object.keys(regions)].forEach(r=>{
    const b=document.createElement("button");b.className="filter"+(r===active?" active":"");b.textContent=r;
    b.onclick=()=>{active=r;document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));b.classList.add("active");render()};
    el.appendChild(b);
  });
}
async function load(){
  const grid=document.getElementById("grid");grid.innerHTML='<div class="empty loading">Loading forecasts…</div>';
  data=await Promise.all(cities.map(async c=>{
    try{
      const u=`https://api.open-meteo.com/v1/forecast?latitude=${c[2]}&longitude=${c[3]}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=7`;
      const r=await fetch(u);const j=await r.json();return {c,j};
    }catch(e){return {c,j:null}}
  }));
  render();
}
function visible(){
  const q=document.getElementById("search").value.toLowerCase();
  return data.filter(({c})=>{
    const region=Object.entries(regions).find(([,names])=>names.includes(c[0]))?.[0];
    return (active==="All"||region===active)&&(`${c[0]} ${c[1]}`.toLowerCase().includes(q));
  });
}
function render(){
  const grid=document.getElementById("grid");const list=visible();
  if(!list.length){grid.innerHTML='<div class="empty">No matching capital cities.</div>';return}
  grid.innerHTML=list.map(({c,j})=>{
    if(!j)return `<article class="card"><div class="city">${c[0]}</div><div class="country">${c[1]}</div><p>Weather unavailable.</p></article>`;
    const x=j.current;return `<article class="card" onclick="showDetail('${c[0].replaceAll("'","\\\\'")}')" style="cursor:pointer">
      <div class="top"><div><div class="city">${c[0]}</div><div class="country">${c[1]}</div></div><div class="icon">${icons[x.weather_code]||"🌡️"}</div></div>
      <div class="temp">${Math.round(x.temperature_2m)}°</div><div class="condition">${labels[x.weather_code]||"Weather"}</div>
      <div class="meta"><span>Feels ${Math.round(x.apparent_temperature)}°</span><span>Humidity ${x.relative_humidity_2m}%</span><span>Wind ${Math.round(x.wind_speed_10m)} km/h</span></div>
    </article>`;
  }).join("");
}
function showDetail(name){
  const item=data.find(x=>x.c[0]===name);if(!item||!item.j)return;
  const {c,j}=item,d=j.daily,box=document.getElementById("detail");
  box.classList.add("show");
  box.innerHTML=`<div class="detail-head"><div><h2>${c[0]}</h2><div style="color:#9ca3af">${c[1]} · 7-day forecast</div></div><button onclick="document.getElementById('detail').classList.remove('show')" style="background:none;border:0;color:#9ca3af;font-size:22px;cursor:pointer">×</button></div>
  <div class="days">${d.time.map((date,i)=>`<div class="day"><small>${new Date(date+'T12:00:00').toLocaleDateString('en',{weekday:'short'})}</small><strong>${icons[d.weather_code[i]]||"🌡️"}</strong><div>${Math.round(d.temperature_2m_max[i])}° / ${Math.round(d.temperature_2m_min[i])}°</div><small>${d.precipitation_probability_max[i]}% rain</small></div>`).join("")}</div>`;
  box.scrollIntoView({behavior:"smooth",block:"nearest"});
}
document.getElementById("search").addEventListener("input",render);
makeFilters();load();
</script>
</body>
</html>
